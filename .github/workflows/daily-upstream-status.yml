name: Daily upstream status and site refresh

on:
  schedule:
    - cron: '17 03 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect public upstream metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs
          python3 - <<'PY'
          import json, os, subprocess
          repos = {
              "ludashi": "StevenMXZ/Winlator-Ludashi",
              "cmod": "coffincolors/winlator",
              "vanilla": "brunodev85/winlator",
          }
          result = {"updated_at": None, "repositories": {}}
          for name, repo in repos.items():
              raw = subprocess.check_output([
                  "gh", "api", f"repos/{repo}/commits?per_page=1",
                  "--header", "Accept: application/vnd.github+json"
              ], text=True)
              commit = json.loads(raw)[0]
              result["repositories"][name] = {
                  "repository": repo,
                  "sha": commit["sha"],
                  "message": commit["commit"]["message"].splitlines()[0],
                  "date": commit["commit"]["committer"]["date"]
              }
          from datetime import datetime, timezone
          result["updated_at"] = datetime.now(timezone.utc).isoformat()
          with open("docs/UPSTREAM_STATUS.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit changed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UPSTREAM_STATUS.json
          git diff --cached --quiet || git commit -m "chore: update daily upstream status"
          git push
